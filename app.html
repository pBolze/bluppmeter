<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">

<title>Bluppmeter</title>

<style>
:root{
    --bg:#faf7f2;
    --card:#ffffff;
    --wine:#7a2e3a;
    --wine-dark:#62232d;
    --gold:#e8c16d;
    --text:#2b2b2b;
}

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    height:100%;
    overflow:hidden;
    font-family:sans-serif;
    background:var(--bg);
    color:var(--text);
}

body{
    display:flex;
    flex-direction:column;
}

#tapArea{
    flex:1;
    position:relative;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    user-select:none;
    -webkit-user-select:none;
    touch-action:manipulation;
    overflow:hidden;
}

#tapArea.flash{
    background:rgba(232,193,109,0.2);
}

.countdown{
    display:flex;
    flex-direction:column;
    align-items:center;
}

.countdownValue{
    font-size:6rem;
    font-weight:700;
    color:var(--wine);
    line-height:1;
}

.countdownLabel{
    margin-top:10px;
    font-size:1.2rem;
    color:#666;
}

.result{
    text-align:center;
}

.resultTitle{
    font-size:1rem;
    letter-spacing:2px;
    color:#666;
    margin-bottom:12px;
}

.resultValue{
    font-size:5rem;
    font-weight:700;
    color:var(--wine);
    line-height:1;
}

.resultUnit{
    font-size:1.4rem;
    font-weight:600;
    color:var(--wine);
    margin-top:8px;
}

.separator{
    width:120px;
    height:2px;
    background:var(--gold);
    margin:24px auto;
    border-radius:2px;
}

.resultDetails{
    font-size:1.15rem;
    line-height:1.8;
    color:#555;
}

#startButton{
    margin:12px;
    height:calc(25vh - 24px);
    border:none;
    border-radius:20px;
    background:var(--wine);
    color:white;
    font-size:1.9rem;
    font-weight:700;
    box-shadow:0 6px 18px rgba(0,0,0,0.15);
}

#startButton:active{
    background:var(--wine-dark);
}

#overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.65);
    display:flex;
    justify-content:center;
    align-items:center;
}

#dialog{
    width:85%;
    max-width:340px;
    background:var(--card);
    border-radius:24px;
    padding:28px;
    text-align:center;
    box-shadow:0 12px 30px rgba(0,0,0,0.25);
}

#dialog h2{
    margin:0 0 10px 0;
    color:var(--wine);
}

.volumeValue{
    font-size:3rem;
    font-weight:700;
    color:var(--wine);
    margin:12px 0;
}

.volumeControls{
    display:flex;
    justify-content:center;
    gap:14px;
    margin:16px 0;
}

.volumeButton{
    width:64px;
    height:64px;
    border:none;
    border-radius:50%;
    font-size:2rem;
    background:var(--wine);
    color:white;
}

#okButton{
    width:100%;
    border:none;
    margin-top:12px;
    padding:14px;
    border-radius:14px;
    font-size:1.2rem;
    font-weight:700;
    background:var(--gold);
    color:#222;
}

.bubble{
    position:absolute;
    width:18px;
    height:18px;
    border-radius:50%;
    pointer-events:none;
    background:rgba(232,193,109,0.7);
    animation:rise 0.9s ease-out forwards;
}

@keyframes rise{
    from{
        opacity:1;
        transform:translateY(0) scale(0.8);
    }
    to{
        opacity:0;
        transform:translateY(-120px) scale(1.5);
    }
}
</style>
</head>

<body>

<div id="tapArea"></div>

<button id="startButton">
    🍷 Neue Messung
</button>

<div id="overlay">
    <div id="dialog">
        <h2>🍇 Volumen</h2>

        <div class="volumeValue">
            <span id="volumeDisplay">10</span> l
        </div>

        <div class="volumeControls">
            <button class="volumeButton" id="minusBtn">−</button>
            <button class="volumeButton" id="plusBtn">+</button>
        </div>

        <button id="okButton">
            Messung starten
        </button>
    </div>
</div>

<script>
const tapArea = document.getElementById("tapArea");
const overlay = document.getElementById("overlay");
const startButton = document.getElementById("startButton");
const plusBtn = document.getElementById("plusBtn");
const minusBtn = document.getElementById("minusBtn");
const volumeDisplay = document.getElementById("volumeDisplay");
const okButton = document.getElementById("okButton");

let volume = 10;
let taps = 0;
let countdown = 60;
let timer = null;
let running = false;

function updateVolumeDisplay() {
    volumeDisplay.textContent = volume;
}

plusBtn.addEventListener("click", () => {
    if (volume < 30) {
        volume++;
        updateVolumeDisplay();
    }
});

minusBtn.addEventListener("click", () => {
    if (volume > 1) {
        volume--;
        updateVolumeDisplay();
    }
});

function showCountdown() {
    tapArea.innerHTML =
        '<div class="countdown">' +
            '<div class="countdownValue">' + countdown + '</div>' +
            '<div class="countdownLabel">Sekunden</div>' +
        '</div>';
}

function createBubble() {
    const bubble = document.createElement("div");
    bubble.className = "bubble";

    bubble.style.left =
        (window.innerWidth * 0.3 +
        Math.random() * window.innerWidth * 0.4) + "px";

    bubble.style.top =
        (window.innerHeight * 0.55 +
        Math.random() * 100) + "px";

    tapArea.appendChild(bubble);

    setTimeout(() => bubble.remove(), 900);
}

function startMeasurement() {

    clearInterval(timer);

    taps = 0;
    countdown = 60;
    running = true;

    showCountdown();

    timer = setInterval(() => {

        countdown--;

        if (countdown >= 0) {
            showCountdown();
        }

        if (countdown <= 0) {

            clearInterval(timer);
            running = false;

            const result =
                Math.round((taps * 60) / volume);

            tapArea.innerHTML =
                '<div class="result">' +

                    '<div class="resultTitle">' +
                    '🍇 GÄRINTENSITÄT' +
                    '</div>' +

                    '<div class="resultValue">' +
                    result +
                    '</div>' +

                    '<div class="resultUnit">' +
                    'blp/h/l' +
                    '</div>' +

                    '<div class="separator"></div>' +

                    '<div class="resultDetails">' +
                    volume + ' l Ansatz<br>' +
                    taps + ' Blupps<br>' +
                    '60 Sekunden' +
                    '</div>' +

                '</div>';
        }

    }, 1000);
}

function showVolumeDialog() {
    clearInterval(timer);
    running = false;
    taps = 0;

    overlay.style.display = "flex";
}

okButton.addEventListener("click", () => {
    overlay.style.display = "none";
    startMeasurement();
});

startButton.addEventListener("click", showVolumeDialog);

tapArea.addEventListener("pointerdown", (event) => {

    if (!running) {
        return;
    }

    taps++;

    tapArea.classList.add("flash");

    createBubble();

    setTimeout(() => {
        tapArea.classList.remove("flash");
    }, 120);
});

updateVolumeDisplay();
showVolumeDialog();
</script>

</body>
</html>
